name: Fetch Daily Affirmation

on:
  workflow_dispatch:   # manual trigger allowed
  schedule:
    - cron: '0 * * * *'  # hourly

jobs:
  fetch_affirmation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Decide whether to run fetch
        id: check_time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run, always fetch
            echo "run=true" >> $GITHUB_OUTPUT
            echo "Manual trigger detected, running fetch."
          else
            SYDNEY_HOUR=$(TZ=Australia/Sydney date +'%H')
            echo "Sydney hour: $SYDNEY_HOUR"
            if [ "$SYDNEY_HOUR" = "00" ]; then
              echo "run=true" >> $GITHUB_OUTPUT
            else
              echo "run=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Prepare directory
        if: steps.check_time.outputs.run == 'true'
        run: mkdir -p affirmation-storage

      - name: Fetch affirmation and save file
        if: steps.check_time.outputs.run == 'true'
        run: |
          RESPONSE=$(curl -s https://www.affirmations.dev/)
          echo "$RESPONSE" > affirmation-storage/affirmation.json

      - name: Commit and push if file changed
        if: steps.check_time.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull
          if ! git diff --quiet; then
            git add affirmation-storage/affirmation.json
            git commit -m "Update daily affirmation"
            git push
          else
            echo "No changes to commit"
          fi
